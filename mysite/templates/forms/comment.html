{% extends 'parent/base.html' %}
{% block title %} comment {% endblock %}
{% block content %}
    {% if comment %}
        کامنت شما با موفقیت ثبت شد.
        <br>
        <a href="{{ post.get_absolute_url }}">برگشت به پست</a>
    {% else %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="ثبت کامنت">
        </form>
    {% endif %}
{% endblock %}
